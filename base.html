<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafío 1 - JavaScript</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <section>
        <div class="card">
            <div class="img-card"></div>
              <h6>Laptop Gamer AMD</h6>
              <p>Precio base: $<span class="precio-inicial"></span> </p>
        
              <p>Cantidad:
                <span class="cantidad">0</span>
                <button onclick="
                aum = document.querySelector('.cantidad')
                cant = Number(aum.innerHTML)
                cant = cant + 1
                aum.innerHTML = cant
                document.querySelector('.valor-total').innerHTML = precio * cant
                "
                >+</button> 
                <button onclick="
                dec = document.querySelector('.cantidad')
                cant = Number(dec.innerHTML)
                cant = cant - 1
                dec.innerHTML = cant
                document.querySelector('.valor-total').innerHTML = precio * cant
                
                "
                >-</button>
              </p>
            </div>

        </div>
    </section>

    <div class="total-section">
        <p>Total a pagar: $<span class="valor-total"></span> </p>
    </div>

    <script src="index.js">
      

    </script>
</body>
</html>
